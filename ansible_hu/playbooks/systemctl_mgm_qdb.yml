---
- name: Restart EOS MGM and QDB services
  hosts: eos_mgm
  become: yes

  tasks:
    - name: Stop eos-mgm
      ansible.builtin.systemd:
        name: eos@mgm
        state: stopped

    - name: Stop qdb service
      ansible.builtin.systemd:
        name: xrootd@quarkdb0
        state: stopped

    - name: Start qdb service
      ansible.builtin.systemd:
        name: xrootd@quarkdb0
        state: started

    - name: Start eos-mgm
      ansible.builtin.systemd:
        name: eos@mgm
        state: started
